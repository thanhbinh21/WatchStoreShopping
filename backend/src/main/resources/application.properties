spring.application.name=Nhom08_WWW_JAVA

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:mariadb://localhost:3306/watch_store
spring.datasource.username=root
spring.datasource.password=root

#spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# T? ??ng c?p nh?t schema (create, create-drop, update, validate)
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create

# In c�u SQL ra console
spring.jpa.show-sql=true

# Format SQL cho d? ??c
spring.jpa.properties.hibernate.format_sql=true

# Dialect cho MariaDB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ===============================
# SERVER
# ===============================
# Port c?a Spring Boot (m?c ??nh 8080)
server.port=8080
